# YTVDLT CI — 建立者：T7（外部审计项：仓库此前无任何 GitHub Actions）。
#
# 触发：push 到 main + 所有 Pull Request。Runner：windows-latest（本项目是
# Windows 专项：随包 yt-dlp.exe / NSIS / Electron 45 均按 Windows 假设构建）。
#
# 步骤顺序 = 维护手册 §7 的本地改动流程（typecheck → npm test → 分层门禁 → 冻结门禁）。
#
# D-161 / 外部审计：本 workflow 会自动运行，但「合并前必须通过」由 GitHub
# 仓库的分支保护 / ruleset 决定，本地 workflow 文件无法自我强制。配置步骤与
# 验收判据见维护手册 §7.1「CI 强制门禁（GitHub 端配置）」。
#
# ── 明确不放进本 CI 的内容（均为有意排除，不是遗漏）────────────────────────
# 1) e2e 截图基线（scripts/run-e2e.mjs + tests/e2e/baselines）：需要
#    chrome-headless-shell（D-105 对构建版本门槛严格）与显示环境，像素级
#    基线在无显示器 CI 上的光栅化结果不可信 —— 后续项，不进本轮 CI。
# 2) 在线测试 vitest.online.config.ts（npm run test:online，D-132）：真实国际网
#    真实下载；默认 vitest.config.ts 已把 tests/integration/online/** 排除在
#    默认套件之外，`npm test` 本身不联网。
# 3) 离线集成用例（npm run test:integration:offline）：整套仍不跑。但**默认
#    套件内的 L2 单测**确实会 spawn 随包 node.exe、读取 yt-dlp.exe 的真实哈希
#    （.gitignore 明确不入库），故本 workflow 在 Tests 之前用 fetch-runtime
#    只取这两项（--only=ytdlp / --only=node，不下载 ffmpeg 的 76 MB 包）。
#    D-157：首次推送的 CI run #1 就是因缺这两类资产 + 未入库的 .log fixture
#    而红；修复后仍不放宽任何断言与覆盖率门限。
# 4) 安装包打包（约 5 分钟且属业主点名项，手册 §0 铁律 9）：见同目录
#    desktop-pack.yml —— 仅 workflow_dispatch 手动触发，永不随 push/PR 运行。
#
# ── 本轮追加说明（A-D206 安全轮）：Security suite 步骤的存在理由 ──────────
# 上方 1)-4) 的排除清单维持不变，本条不是排除项。新增的「Security suite
# (fail-closed · links · registry i18n)」步骤（Tests 之后、门禁之前）：
# 7 个安全边界测试文件本就在 npm test 全量套件内，该步骤把它们【点名单独
# 重跑】（显式纳入：每个文件对应本轮安全要求 1-6 之一，映射见步骤注释），
# 并带一个跳过守卫（要求 7：windows-latest 管理员 runner 上
# win-fs-link-security 的 skipped 必须为 0；守卫对 vitest JSON 结果做结构
# 性校验——缺文件/坏 JSON/非终态用例一律显式失败，绝不静默放过）。这是
# 增量步骤：既有门禁（typecheck / coverage 阈值 / layering / frozen）与
# job 名（= required status check）一律未动。特殊权限说明（要求 8）：
# junction 无需权限；文件/目录 symlink 需要 SeCreateSymbolicLinkPrivilege
# —— runner 以管理员运行可用；本地无开发者模式时按能力探测显式 skip，
# 本地覆盖范围以 A-D206 能力探测输出为准（详见该步骤注释与
# tests/unit/win-fs-link-security.test.ts 头注释）。

name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支/PR 的旧 run 被新 push 取代时取消旧 run，省 runner 时间。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: typecheck · tests · gates (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # pnpm 版本不在这里硬编码：pnpm/action-setup@v4 未传 version 时自动读取
      # 根 package.json 的 "packageManager": "pnpm@9.15.9" 字段。
      # 已核对 pnpm-lock.yaml 顶部 lockfileVersion: '9.0'，与 pnpm 9.x 系列一致
      # （若将来仓库缺失 packageManager 字段，才需要改从 lockfileVersion 推断）。
      - name: Install pnpm (version from package.json packageManager)
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      # Node 版本依据（仓库无 .nvmrc）：
      #   - 根 package.json "engines": { "node": ">=22" }
      #   - docs/BUILD.md 环境表实测基线为 Node 22.x
      #   - devDependencies @types/node ^22.15 与 22 LTS 匹配
      # 故取 22 LTS（当前 22.x，满足 engines >=22）。
      - name: Setup Node 22 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile：CI 必须按 pnpm-lock.yaml 精确安装（R3 门禁的另一半：
      # 依赖只允许来自锁文件，不允许临时解析）。
      # 说明：electron@45 的 postinstall 会下载预编译二进制（约 100 MB）。虽然
      # unit/contract 测试用假 Electron stub，这里仍保持默认安装不设
      # ELECTRON_SKIP_BINARY_DOWNLOAD=1 —— 不给首轮 CI 引入任何「跳过了什么」
      # 的未知变量；若日后要提速可再评估该开关。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 照抄根 package.json scripts："typecheck": "turbo run typecheck"
      # （五个 workspace 包各自执行 tsc --noEmit -p tsconfig.json）。
      - name: Typecheck
        run: pnpm typecheck

      # 照抄根 package.json scripts："test": "node scripts/run-tests.mjs all --coverage"
      #   - all = tests/unit + tests/contract（v8 覆盖率）；
      #   - vitest.config.ts 强制 lines/branches/functions/statements 四维 >=70 门限，
      #     不达标直接非零退出；
      #   - 沙箱批量删除守卫（scripts/lib/vitest-run.mjs，决策 D-29 + D-32）只在
      #     子进程输出出现 SAFE_DELETE_BULK_CONFIRM_REQUIRED 标记时才介入：GitHub
      #     runner 无该沙箱守卫，测试全绿 → vitest exit 0 → 守卫判 CLEAN 放行；
      #     测试真实失败 → 守卫判 REJECTED（GUARD_MARKER_ABSENT）→ 非零退出使
      #     本 job 失败。守卫在干净 CI 下不需要任何环境变量，守卫会自动在
      #     spawn 前清理 reports/vitest-results.json / coverage/coverage-summary.json
      #     旧证据（单文件 unlink），无历史 reports/ 产物也能跑通。
      # D-157: the default suite contains L2 cases that spawn the bundled
      # node.exe and hash the real yt-dlp.exe. Those binaries are NOT committed
      # (架构 §2.7 / O-05), so a clean runner must fetch them before `npm test`.
      # Only these two keys: ffmpeg is neither needed by the gates nor stable
      # enough as a rolling `latest` asset. The fetcher verifies yt-dlp against
      # the official SHA2-256SUMS and has bounded retries + timeouts.
      - name: Fetch bundled yt-dlp.exe for L2 tests
        run: node scripts/fetch-runtime.mjs --only=ytdlp
      - name: Fetch bundled node.exe for L2 tests
        run: node scripts/fetch-runtime.mjs --only=node

      - name: Tests (unit + contract with coverage gate)
        run: npm test

      # ── Security suite（A-D206 安全轮 · 本轮安全边界测试的显式纳入，要求 9）──
      # 以下 7 个文件已被上面的 npm test 全量套件覆盖；这里【点名单独重跑】，
      # 让本轮安全要求（1-6）在 CI 报告里有步骤级、可定位的证据，而不是混在
      # 全量结果里。文件 ↔ 本轮安全要求映射：
      #   - tests/unit/artifact-containment-actions.test.ts → 要求 3/5
      #     （request===null 时回收门 fail-closed、越界拒绝、混合批整批拒绝、
      #     回收站 spy 零误收；D-182 / D-203）
      #   - tests/unit/restore-chain-fail-closed.test.ts → 要求 4（损坏快照走
      #     完整启动恢复链后，危险 artifacts 不复活；A-D203 / D-195）
      #   - tests/unit/win-fs-link-security.test.ts → 要求 1/2/5（真实
      #     junction/symlink：D-203 删除守卫 + D-204 realpath 打开守卫 +
      #     拒绝时回收站零调用；A-D206）
      #   - tests/unit/task-detail.test.ts / task-detail-folder.test.ts →
      #     要求 2 的打开面（open 门 fail-closed + realpath 分支；D-204）
      #   - tests/unit/win-startup.test.ts → 要求 6（注册表多语种 not-found
      #     识别 + Access-Denied / 未知错误 fail-closed；D-166）
      #   - tests/unit/path-containment.test.ts → 要求 1 的纯函数门面（路径
      #     归一化 / 长路径前缀 / UNC 形态；D-182）
      # 特殊权限说明（要求 8）：junction 创建【无需】任何权限（junction 用例
      # 永不跳过）；文件/目录 symlink 需要 SeCreateSymbolicLinkPrivilege ——
      # windows-latest runner 以管理员运行，应当可用。本地开发机无开发者模式
      # 时，该套件按能力探测对 file-symlink / UNC 用例【显式 skip】（可数，
      # 不静默），本地覆盖范围以 A-D206 能力探测输出（A-0/B-0/C-1 用例的
      # stdout）为准，详见 tests/unit/win-fs-link-security.test.ts 头注释。
      # Reporter 说明：CLI 显式指定 --reporter 会整体覆盖 vitest.config.ts 的
      # reporters，把定向结果落到独立文件 reports/vitest-security-results.json
      # —— 不会覆盖 Tests 步骤全量套件写入的 reports/vitest-results.json
      # （scripts/acceptance.mjs 的证据输入）。
      # shell: bash 说明：Actions 对 windows 的默认 pwsh 只把【最后一条】命令
      # 的 $LASTEXITCODE 作为步骤退出码，多行 run 里 vitest 失败会被下一行吞掉；
      # bash（Actions 自动附加 -eo pipefail）保证任何一条命令非零即整步失败。
      - name: Security suite (fail-closed · links · registry i18n)
        shell: bash
        run: |
          pnpm exec vitest run \
            --reporter=default \
            --reporter=json \
            --outputFile.json=reports/vitest-security-results.json \
            tests/unit/artifact-containment-actions.test.ts \
            tests/unit/restore-chain-fail-closed.test.ts \
            tests/unit/win-fs-link-security.test.ts \
            tests/unit/task-detail.test.ts \
            tests/unit/task-detail-folder.test.ts \
            tests/unit/win-startup.test.ts \
            tests/unit/path-containment.test.ts
          # 跳过守卫（要求 7）：CI 管理员 runner 上 win-fs-link-security 的
          # skipped 必须为 0（junction 用例无需权限、永不跳过）。守卫同时做
          # 结构性校验：JSON 缺失/损坏、七个文件任何一个没出现在结果里、
          # 非终态用例、运行未全绿 —— 一律 exit 2 拒绝放行，绝不静默放过。
          node scripts/check-security-suite-results.mjs reports/vitest-security-results.json

      # 分层依赖检查（core 禁 import node:*/electron；结果写 reports/layering.json，
      # 目录不存在时脚本自建，gitignore 不影响）。
      - name: Layering check
        run: node scripts/check-layering.mjs

      # 冻结门禁（D-50 request.ts 逐字节 / D-61 devDependencies 白名单 / 锁文件
      # 无依赖消失）。脚本对 HEAD 做 git diff / git show —— actions/checkout 的
      # 浅克隆含 HEAD，满足其比较基准。
      - name: Frozen gate
        run: node scripts/frozen-gate.mjs
